# San Francisco Rush 2049 (N64) - US Version
# Splat configuration for ROM extraction and decompilation

name: San Francisco Rush 2049 (US)
sha1: 3f99351d7bb61656614bdb2aa1a90cfe55d1922c

options:
  basename: rush2049
  target_path: baserom.us.z64
  elf_path: build/us/rush2049.us.elf
  base_path: .
  platform: n64
  compiler: IDO  # Likely IDO 5.3 or 7.1

  # Output paths
  asm_path: asm/us
  src_path: src
  build_path: build/us
  asset_path: assets/us
  cache_path: .splat_cache

  # Build settings
  create_asm_dependencies: True
  ld_script_path: rush2049.us.ld
  ld_dependencies: True

  # Analysis settings
  find_file_boundaries: True
  header_encoding: ASCII

  # Compiler/assembler settings
  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  section_order: [".text", ".data", ".rodata", ".bss"]
  auto_link_sections: [".data", ".rodata", ".bss"]

  # Symbol files
  symbol_addrs_path:
    - symbol_addrs.us.txt
  reloc_addrs_path:
    - reloc_addrs.us.txt

  undefined_funcs_auto_path: undefined_funcs_auto.us.txt
  undefined_syms_auto_path: undefined_syms_auto.us.txt

  # Extensions
  extensions_path: tools/splat_ext

  # String detection
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  # N64 SDK symbols
  libultra_symbols: True
  hardware_regs: True

  # Graphics microcode (Rush 2049 likely uses F3DEX2)
  gfx_ucode: f3dex2

segments:
  # N64 ROM Header (0x00 - 0x40)
  - name: header
    type: header
    start: 0x0

  # IPL3 Boot code (0x40 - 0x1000)
  - name: ipl3
    type: bin
    start: 0x40

  # Entry point / boot code
  - name: entry
    type: code
    start: 0x1000
    vram: 0x80000400
    subsegments:
      - [0x1000, hasm]

  # Main code segment - split based on splat's file boundary detection
  - name: main
    type: code
    start: 0x1050
    vram: 0x80000450
    follows_vram: entry
    subsegments:
      - [0x1050, c, rom/lib_1050_sdk]
      - [0x1F50, c, rom/lib_1050]
      - [0x21F0, c, rom/lib_21f0]
      - [0x2CF0, c, rom/lib_2cf0]
      - [0x3140, c, rom/lib_3140]
      - [0x3330, c, rom/lib_3330]
      - [0x3390, c, rom/lib_3390]
      - [0x34A0, c, rom/lib_34a0]
      - [0x55F0, asm]
      - [0x5610, c, rom/lib_5610]
      - [0x7600, c, rom/lib_7600]
      - [0x7630, c, rom/lib_7630]
      - [0x7940, c, rom/lib_7940]
      - [0x79A0, c, rom/lib_79a0]
      - [0x7A10, c, rom/lib_7a10]
      - [0x7AD0, c, rom/lib_7ad0]
      - [0x7B30, c, rom/lib_7b30]
      - [0x7C80, c, rom/lib_7c80]
      - [0x7FB0, c, rom/lib_7fb0]
      - [0x8040, c, rom/lib_8040_msg]
      - [0x8190, c, rom/lib_8040]
