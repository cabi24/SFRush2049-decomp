[pytest]
testpaths = tests/conveyor tests/cloud
addopts = -q
markers =
    node_required: needs a live compute node attached to the coordinator (deselect with '-m "not node_required"')
    serial(reason): shares a fixed path, the repository tree or another process-wide resource with other tests; never run under pytest-xdist (`make test-fast` runs these after the parallel part)
